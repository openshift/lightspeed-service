apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/created-by: lightspeed-operator
    app.kubernetes.io/instance: olsconfig-sample
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: olsconfig
    app.kubernetes.io/part-of: lightspeed-operator
spec:
  llm:
    providers:
    - name: openai
      type: openai
      credentialsSecretRef:
        name: openaicreds
      models:
      - name: gpt-6-luna
    - name: azure_openai
      type: azure_openai
      credentialsSecretRef:
        name: azure-openaicreds
      deploymentName: gpt-6-luna
      models:
      - name: gpt-6-luna
      url: https://ols-test.openai.azure.com/
    - name: bedrock
      type: bedrock
      url: https://bedrock-mantle.us-east-1.api.aws
      credentialsSecretRef:
        name: llmcreds
      models:
      - name: anthropic.claude-haiku-5-5
      - name: openai.gpt-6-luna
    - name: google_vertex
      type: google_vertex
      credentialsSecretRef:
        name: google-vertexcreds
      models:
      - name: gemini-3.1-flash-lite
      googleVertexConfig:
        projectID: openshift-lightspeed-tests
        location: global
      url: https://aiplatform.googleapis.com/
    - name: google_vertex_anthropic
      type: google_vertex_anthropic
      credentialsSecretRef:
        name: google-vertex-anthropiccreds
      models:
      - name: claude-sonnet-4-6
      googleVertexAnthropicConfig:
        projectID: openshift-lightspeed-tests
        location: global
      url: https://aiplatform.googleapis.com/
    - name: watsonx
      type: watsonx
      credentialsSecretRef:
        name: watsonxcreds
      projectID: ad629765-c373-4731-9d69-dc701724c081
      models:
      - name: ibm/granite-4-h-small
    - name: rhoai_vllm
      type: rhoai_vllm
      credentialsSecretRef:
        name: rhoai-vllmcreds
      models:
      - name: gpt-4.1-mini
    - name: rhelai_vllm
      type: rhelai_vllm
      credentialsSecretRef:
        name: rhelai-vllmcreds
      models:
      - name: gpt-4.1-mini
  ols:
    defaultModel: gpt-6-luna
    defaultProvider: openai
    deployment:
      replicas: 1
    disableAuth: false
    logLevel: DEBUG
    introspectionEnabled: false
    userDataCollection:
      feedbackDisabled: true
      transcriptsDisabled: true
    guardrails:
      toolResultInspection:
        enabled: true
    toolsApprovalConfig:
      approvalType: never
      approvalTimeout: 5
    toolFilteringConfig:
      alpha: 0.8
      topK: 10
      threshold: 0.01
  mcpServers:
  - name: mock-file-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: secret
        secretRef:
          name: mcp-test-token
  - name: mock-k8s-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: kubernetes
  - name: mock-client-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: client
  - name: mock-inspection
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: client
  - name: mock-bad-url
    url: http://localhost:19999
  featureGates:
  - MCPServer
  - ToolFiltering
