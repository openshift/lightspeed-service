apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/created-by: lightspeed-operator
    app.kubernetes.io/instance: olsconfig-sample
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: olsconfig
    app.kubernetes.io/part-of: lightspeed-operator
spec:
  llm:
    providers:
    - name: bedrock
      type: bedrock
      url: https://bedrock-mantle.us-east-1.api.aws
      credentialsSecretRef:
        name: llmcreds
      models:
      - name: anthropic.claude-sonnet-4-6
  ols:
    defaultModel: anthropic.claude-sonnet-4-6
    defaultProvider: bedrock
    deployment:
      replicas: 1
    disableAuth: false
    logLevel: DEBUG
    introspectionEnabled: false
    userDataCollection:
      feedbackDisabled: true
      transcriptsDisabled: true
    guardrails:
      toolResultInspection:
        enabled: true
    toolsApprovalConfig:
      approvalType: never
      approvalTimeout: 5
    toolFilteringConfig:
      alpha: 0.8
      topK: 10
      threshold: 0.01
  mcpServers:
  - name: mock-file-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: secret
        secretRef:
          name: mcp-test-token
  - name: mock-k8s-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: kubernetes
  - name: mock-client-auth
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: client
  - name: mock-inspection
    url: http://mcp-mock-server.openshift-lightspeed.svc.cluster.local:3000
    headers:
    - name: Authorization
      valueFrom:
        type: client
  - name: mock-bad-url
    url: http://localhost:19999
  featureGates:
  - MCPServer
  - ToolFiltering
