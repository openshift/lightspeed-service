apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/created-by: lightspeed-operator
    app.kubernetes.io/instance: olsconfig-sample
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: olsconfig
    app.kubernetes.io/part-of: lightspeed-operator
spec:
  llm:
    providers:
    - name: openai
      type: openai
      credentialsSecretRef:
        name: openaicreds
      models:
      - name: gpt-6-luna
        parameters:
          reasoningConfig:
            effort: medium
    - name: azure_openai
      type: azure_openai
      credentialsSecretRef:
        name: azure-openaicreds
      apiVersion: "2025-04-01-preview"
      deploymentName: gpt-6-luna
      models:
      - name: gpt-6-luna
        parameters:
          reasoningConfig:
            effort: medium
      url: https://ols-test.openai.azure.com/
    - name: bedrock
      type: bedrock
      url: https://bedrock-mantle.us-east-1.api.aws
      credentialsSecretRef:
        name: llmcreds
      models:
      - name: openai.gpt-6-luna
    - name: google_vertex_anthropic
      type: google_vertex_anthropic
      credentialsSecretRef:
        name: google-vertex-anthropiccreds
      models:
      - name: claude-sonnet-4-6
      googleVertexAnthropicConfig:
        projectID: openshift-lightspeed-tests
        location: global
      url: https://aiplatform.googleapis.com/
    - name: google_vertex
      type: google_vertex
      credentialsSecretRef:
        name: google-vertexcreds
      models:
      - name: gemini-3.1-flash-lite
      googleVertexConfig:
        projectID: openshift-lightspeed-tests
        location: global
      url: https://aiplatform.googleapis.com/
    - name: watsonx
      type: watsonx
      credentialsSecretRef:
        name: watsonxcreds
      projectID: ad629765-c373-4731-9d69-dc701724c081
      models:
      - name: ibm/granite-4-h-small
  ols:
    defaultModel: gpt-6-luna
    defaultProvider: openai
    deployment:
      replicas: 1
    disableAuth: false
    logLevel: DEBUG
    queryFilters:
      - name: foo_filter
        pattern: '\b(?:foo)\b'
        replaceWith: "deployment"
      - name: bar_filter
        pattern: '\b(?:bar)\b'
        replaceWith: "openshift"
    introspectionEnabled: true
    userDataCollection:  # disable user collection for this test suite
      feedbackDisabled: true
      transcriptsDisabled: true
