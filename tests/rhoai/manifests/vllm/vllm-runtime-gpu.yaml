apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    openshift.io/display-name: vLLM GPU
  name: vllm-gpu
  namespace: e2e-rhoai-dsc
  labels:
    opendatahub.io/dashboard: "true"
spec:
  builtInAdapter:
    modelLoadingTimeoutMillis: 90000
  containers:
    - args:
        - --model
        - ${VLLM_MODEL}
        - --enable-auto-tool-choice
        - --tool-call-parser 
        - ${VLLM_TOOL_CALL_PARSER}
        - --chat-template 
        - /mnt/chat-template/chat_template.jinja
        - --tensor-parallel-size
        - "${VLLM_TENSOR_PARALLEL_SIZE}"
        - --download-dir
        - /tmp/models-cache
        - --port
        - "8080"
        - --max-model-len
        - "${VLLM_MAX_MODEL_LEN}"
        - --gpu-memory-utilization
        - "${VLLM_GPU_MEMORY_UTILIZATION}"
      image: ${VLLM_IMAGE}
      name: kserve-container
      env:
        - name: HF_HUB_OFFLINE
          value: "false"
        - name: TRANSFORMERS_OFFLINE
          value: "false"
        - name: HF_DATASETS_OFFLINE
          value: "false"
        - name: HF_HOME
          value: /mnt/models-cache/hf_home
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key-secret
              key: key
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      volumeMounts:
        - name: chat-template
          mountPath: /mnt/chat-template
        - name: models-cache
          mountPath: /mnt/models-cache
        - name: vllm-cache
          mountPath: /.cache
      resources:
        limits:
          nvidia.com/gpu: ${VLLM_GPU_COUNT}
          cpu: "${VLLM_RUNTIME_CPU_LIMIT}"
          memory: ${VLLM_RUNTIME_MEMORY_LIMIT}
        requests:
          nvidia.com/gpu: ${VLLM_GPU_COUNT}
          cpu: "${VLLM_RUNTIME_CPU_REQUEST}"
          memory: ${VLLM_RUNTIME_MEMORY_REQUEST}
  volumes:
    - name: chat-template
      configMap:
        name: ${VLLM_CHAT_TEMPLATE_CONFIGMAP}
        items:
          - key: ${VLLM_CHAT_TEMPLATE_KEY}
            path: chat_template.jinja
    - name: models-cache
      emptyDir: {}
    - name: vllm-cache
      emptyDir: {}
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
