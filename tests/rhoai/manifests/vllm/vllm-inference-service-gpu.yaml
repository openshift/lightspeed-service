apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: vllm-model
  namespace: e2e-rhoai-dsc
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    sidecar.istio.io/inject: "false"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu
      resources:
        limits:
          nvidia.com/gpu: ${VLLM_GPU_COUNT}
          cpu: "${VLLM_INFERENCE_SERVICE_CPU_LIMIT}"
          memory: ${VLLM_INFERENCE_SERVICE_MEMORY_LIMIT}
        requests:
          nvidia.com/gpu: ${VLLM_GPU_COUNT}
          cpu: "${VLLM_INFERENCE_SERVICE_CPU_REQUEST}"
          memory: ${VLLM_INFERENCE_SERVICE_MEMORY_REQUEST}
