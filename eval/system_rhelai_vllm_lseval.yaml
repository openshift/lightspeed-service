# LightSpeed Evaluation Framework Configuration
# OLS Provider: RHEL AI vLLM (model being evaluated)
# Judge LLM: OpenAI gpt-6-luna (scoring responses)
#
# The default model "gpt-4.1-mini" is the alias registered in the vLLM deployment.
# Override it for your deployment via the LSEVAL_OLS_MODEL environment variable, e.g.:
#   export LSEVAL_OLS_MODEL=ibm/granite-3.1-8b-instruct

# Judge uses OpenAI gpt-6-luna; set OPENAI_API_KEY for judge requests.
# OLS must have rhelai_vllm configured with vLLM endpoint and token in olsconfig.
# The test runner replaces api_base; LSEVAL_OLS_MODEL overrides the deployed model alias.
# OLS query endpoint is supported; streaming is not supported by the evaluation tool.
core:
  max_threads: 5
  cache_enabled: false

llm_pool:
  defaults:
    timeout: 300
    num_retries: 3
    parameters:
      temperature: 1
      max_completion_tokens: 1024
  models:
    judge:
      provider: openai
      model: gpt-6-luna

judge_panel:
  judges:
    - judge

agents:
  enabled: true
  default:
    agent: [ols_conversational]
    agent_config:
      timeout: 300
      num_retries: 3
  ols_conversational:
    type: http_api
    api_base: http://localhost:8080
    version: v1
    endpoint_type: query
    provider: "rhelai_vllm"
    model: "gpt-4.1-mini"
    system_prompt: null
    extra_request_params: null        # Set mode here for OLS request modes such as troubleshooting.

# Metrics evaluated per conversation turn
metrics_metadata:
  turn_level:
    "custom:answer_correctness":
      # threshold intentionally omitted: no agreed baseline yet.
      # Scores are recorded to track the trend over time; a threshold
      # will be introduced once the average trend is established.
      description: "Correctness vs expected answer using custom LLM evaluation"
      default: true

# Output Configuration
storage:
  - type: file
    output_dir: "./eval_output"
    base_filename: "evaluation"
    enabled_outputs:
      - csv
      - json

# Visualization settings
visualization:
  figsize: [12, 8]
  dpi: 300
  enabled_graphs:
    - "score_distribution"
    - "status_breakdown"

# Environment Variables
environment:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  DEEPEVAL_DISABLE_PROGRESS_BAR: "YES"
  LITELLM_LOG: ERROR
  LITELLM_DROP_PARAMS: "True"

# Logging Configuration
logging:
  source_level: INFO
  package_level: ERROR
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  show_timestamps: true
  package_overrides:
    httpx: ERROR
    urllib3: ERROR
    requests: ERROR
    matplotlib: ERROR
    LiteLLM: WARNING
    DeepEval: WARNING
    ragas: WARNING
