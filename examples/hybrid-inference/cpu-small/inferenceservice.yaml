apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: cpu-small
  namespace: openshift-lightspeed
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      inference: cpu-small
    tolerations:
      - key: inference
        operator: Equal
        value: cpu-small
        effect: NoSchedule
    model:
      modelFormat:
        name: vLLM
      runtime: cpu-small-runtime
      args:
        - --model=Qwen/Qwen-AgentWorld-35B-A3B
        - --served-model-name=hybrid-model
        - --max-model-len=32768
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
        - --reasoning-parser=qwen3
        - --language-model-only
      resources:
        requests:
          cpu: "10"
          memory: 100Gi
        limits:
          cpu: "14"
          memory: 128Gi
