apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: cpu-small
  namespace: openshift-lightspeed
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      inference: cpu-small
    tolerations:
      - key: inference
        operator: Equal
        value: cpu-small
        effect: NoSchedule
    model:
      modelFormat:
        name: vLLM
      runtime: cpu-small-runtime
      args:
        - --model=Qwen/Qwen-AgentWorld-35B-A3B
        - --served-model-name=hybrid-model
        - --max-model-len=32768
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
        - --reasoning-parser=qwen3
        - --language-model-only
        - '--default-chat-template-kwargs={"enable_thinking": false}'
      env:
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "16-30"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
      resources:
        requests:
          cpu: "24"
          memory: 100Gi
        limits:
          cpu: "28"
          memory: 128Gi
