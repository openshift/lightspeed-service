apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cpu-small/pvc.yaml
  - cpu-small/servingruntime.yaml
  - cpu-small/inferenceservice.yaml
  - gpu-large/pvc.yaml
  - gpu-large/servingruntime.yaml
  - gpu-large/inferenceservice.yaml
  - praxis/deployment.yaml
  - ols/olsconfig.yaml

configMapGenerator:
  - name: praxis-config
    namespace: openshift-lightspeed
    files:
      - config.yaml=praxis/config.yaml

secretGenerator:
  - name: llmcreds-praxis
    namespace: openshift-lightspeed
    options:
      disableNameSuffixHash: true
    literals:
      - apitoken=unused
