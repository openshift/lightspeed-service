apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cpu-small/pvc.yaml
  - cpu-small/servingruntime.yaml
  - cpu-small/inferenceservice.yaml
  - gpu-large/pvc.yaml
  - gpu-large/servingruntime.yaml
  - gpu-large/inferenceservice.yaml
  - ols/olsconfig.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: llmcreds
    namespace: openshift-lightspeed
    literals:
      - apitoken=unused
