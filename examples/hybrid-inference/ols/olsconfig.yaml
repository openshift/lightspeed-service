apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  namespace: openshift-lightspeed
spec:
  llm:
    providers:
      - name: cpu-small
        type: rhoai_vllm
        url: http://cpu-small-predictor.openshift-lightspeed.svc.cluster.local:8080/v1
        credentialsSecretRef:
          name: llmcreds-cpu-small
        models:
          - name: cpu-small
            contextWindowSize: 16384
      - name: gpu-large
        type: rhoai_vllm
        url: http://gpu-large-predictor.openshift-lightspeed.svc.cluster.local:8080/v1
        credentialsSecretRef:
          name: llmcreds-gpu-large
        models:
          - name: gpu-large
            contextWindowSize: 32768
  ols:
    defaultProvider: gpu-large
    defaultModel: gpu-large
    introspectionEnabled: false
