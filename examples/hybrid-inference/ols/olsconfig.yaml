apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
  namespace: openshift-lightspeed
spec:
  llm:
    providers:
      - name: praxis
        type: rhoai_vllm
        url: http://praxis.openshift-lightspeed.svc.cluster.local:8080/v1
        credentialsSecretRef:
          name: llmcreds-praxis
        models:
          - name: hybrid-model
            contextWindowSize: 32768
  ols:
    defaultProvider: praxis
    defaultModel: hybrid-model
    introspectionEnabled: false
